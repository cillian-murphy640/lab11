name: Bash CI

on:
  push:
    branches: [main]
    paths:
      - "**/*.sh"
      - ".github/workflows/bash-ci.yml"
  pull_request:
    branches: [main]
    paths:
      - "**/*.sh"
      - ".github/workflows/bash-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run ShellCheck on *.sh files only
        run: find . -type f -name "*.sh" -not -path "./.git/*" -print0 | xargs -0 shellcheck
