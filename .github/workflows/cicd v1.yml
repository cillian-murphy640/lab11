name: HTML CI/CD Pipeline

on:
  push:
    branches: [main]
    paths:
      - "**/*.html"
      - ".github/workflows/cicd.yml"
  pull_request:
    branches: [main]
    paths:
      - "**/*.html"
      - ".github/workflows/cicd.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  # ---------- CI: validate the webpage ----------
  ci:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Lint HTML
        run: npx --yes htmlhint "**/*.html"

      - name: Check phrase appears anywhere in the HTML (case-insensitive)
        run: grep -rqi --include="*.html" "hello from cd lab" .

  # ---------- CD: build the Pages artifact ----------
  build:
    needs: ci
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

  # ---------- CD: deploy to GitHub Pages ----------
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
